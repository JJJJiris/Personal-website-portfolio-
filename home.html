<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="" id="meta-desc" />
    <title id="doc-title">作品集 · 个人简历</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="home">
    <div class="grain" aria-hidden="true"></div>

    <header class="site-header">
      <div class="site-header-inner">
        <a href="home.html" class="logo" data-i18n="site.name">姜春蔚</a>
        <nav class="nav" aria-label="主目录">
          <a href="home.html" class="nav-link active" data-i18n="navHome">主页</a>
          <a href="home.html#about" class="nav-link" data-i18n="nav.about">简介</a>
          <a href="resume.html" class="nav-link" data-i18n="nav.resume">简历</a>
          <a href="home.html#work" class="nav-link" data-i18n="nav.work">作品</a>
          <a href="home.html#contact" class="nav-link" data-i18n="nav.contact">联系</a>
        </nav>
      </div>
    </header>

    <main id="top">
      <section id="about" class="section profile-section">
        <h2 class="section-title" data-i18n="section.about">简介</h2>
        <div class="profile-card">
          <div class="profile-copy">
            <div class="resume-info-grid">
              <div class="resume-info-item">
                <span class="resume-info-label" data-i18n="profile.nameLabel">姓名</span>
                <span class="resume-info-value" id="profile-name"></span>
              </div>
              <div class="resume-info-item">
                <span class="resume-info-label" data-i18n="profile.emailLabel">邮箱</span>
                <span class="resume-info-value"><a id="profile-email" href="mailto:um56912@um.edu.mo">um56912@um.edu.mo</a></span>
              </div>
              <div class="resume-info-item">
                <span class="resume-info-label" data-i18n="profile.phoneLabel">电话</span>
                <span class="resume-info-value"><a id="profile-phone" href="tel:15543602223">15543602223</a></span>
              </div>
              <div class="resume-info-item">
                <span class="resume-info-label" data-i18n="profile.locationLabel">所在地</span>
                <span class="resume-info-value" id="profile-location"></span>
              </div>
              <div class="resume-info-item">
                <span class="resume-info-label" data-i18n="profile.educationLabel">学历</span>
                <span class="resume-info-value" id="profile-education"></span>
              </div>
            </div>
            <p id="profile-intro" class="profile-intro"></p>
            <ul id="profile-highlights" class="profile-highlights"></ul>
            <p class="profile-hint" data-i18n="home.profileHint"></p>
            <a href="resume.html" class="btn-profile-cta"><span data-i18n="home.ctaFullResume">查看完整简历与导出 PDF</span></a>
          </div>
          <div class="profile-media">
            <img id="profile-photo" src="images/profile-jiang-chunwei.png" alt="姜春蔚" width="768" height="1024" />
          </div>
        </div>
      </section>

      <section id="work" class="section work">
        <div class="work-head">
          <div class="work-head-text">
            <h2 class="section-title" data-i18n="section.work">作品集</h2>
            <p class="work-intro" data-i18n="work.intro"></p>
          </div>
          <div class="filters" role="tablist" aria-label="作品分类">
            <button type="button" class="filter active" data-filter="all" role="tab" aria-selected="true">
              <span class="filter-icon filter-icon--all" aria-hidden="true"></span>
              <span data-i18n="filter.all">全部</span>
            </button>
            <button type="button" class="filter" data-filter="graphic" role="tab" aria-selected="false">
              <span class="filter-icon filter-icon--graphic" aria-hidden="true"></span>
              <span data-i18n="filter.graphic">平面</span>
            </button>
            <button type="button" class="filter" data-filter="product" role="tab" aria-selected="false">
              <span class="filter-icon filter-icon--product" aria-hidden="true"></span>
              <span data-i18n="filter.product">产品</span>
            </button>
            <button type="button" class="filter" data-filter="spatial" role="tab" aria-selected="false">
              <span class="filter-icon filter-icon--spatial" aria-hidden="true"></span>
              <span data-i18n="filter.spatial">空间</span>
            </button>
          </div>
        </div>

        <div class="project-grid project-grid--featured" id="project-grid"></div>
      </section>

      <section id="contact" class="section contact">
        <h2 class="section-title" data-i18n="section.contact">联系</h2>
        <p class="contact-text">
          <span data-i18n="contact.line1">合作或投递机会欢迎来信：</span>
          <a id="contact-mail" href="mailto:hello@example.com">hello@example.com</a>
        </p>
        <p class="contact-note" data-i18n="contact.note">将邮箱替换为你的真实邮箱即可。</p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <span class="site-footer-copy"
          >© <span id="year"></span> <span data-i18n="site.name">姜春蔚</span></span
        >
        <a href="index.html" class="footer-lang-link no-print" data-i18n="footer.langLink">欢迎页 · 语言</a>
      </div>
    </footer>

    <script src="app.js" defer></script>
  </body>
</html>
