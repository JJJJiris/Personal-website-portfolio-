<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="" id="meta-desc" />
    <title id="doc-title">简历</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="resume">
    <div class="grain" aria-hidden="true"></div>

    <header class="site-header">
      <div class="site-header-inner">
        <a href="home.html" class="logo" data-i18n="site.name">姜春蔚</a>
        <nav class="nav" aria-label="主目录">
          <a href="home.html" class="nav-link" data-i18n="navHome">主页</a>
          <a href="home.html#about" class="nav-link" data-i18n="nav.about">简介</a>
          <a href="resume.html" class="nav-link active" data-i18n="nav.resume">简历</a>
          <a href="home.html#work" class="nav-link" data-i18n="nav.work">作品</a>
          <a href="home.html#contact" class="nav-link" data-i18n="nav.contact">联系</a>
        </nav>
      </div>
    </header>

    <main id="top">
      <section id="resume" class="section resume resume-page">
        <header class="resume-section-head resume-section-head--intro">
          <h2 class="section-title" data-i18n="section.resume">简历</h2>
          <p class="resume-subline" data-i18n="resume.subline"></p>
        </header>

        <div class="resume-grid">
          <div class="resume-block">
            <h3 data-i18n="resume.experience">经历</h3>
            <ul class="timeline" id="timeline-exp"></ul>
          </div>
          <div class="resume-block">
            <h3 data-i18n="resume.education">教育</h3>
            <ul class="timeline" id="timeline-edu"></ul>
          </div>
          <div class="resume-block resume-skills">
            <h3 data-i18n="resume.skills">技能与工具</h3>
            <p class="skills" id="resume-skills-text"></p>
          </div>
        </div>

        <div class="resume-actions no-print resume-actions--footer">
          <button type="button" id="btn-print-resume" class="btn-pdf" data-i18n="btn.printResume">
            导出 PDF 简历
          </button>
          <span class="pdf-hint" data-i18n="resume.printHint"></span>
          <p class="resume-back-wrap">
            <a href="home.html" class="link-cta subtle" data-i18n="resume.backHome">← 返回主页</a>
          </p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <span class="site-footer-copy"
          >© <span id="year"></span> <span data-i18n="site.name">姜春蔚</span></span
        >
        <a href="index.html" class="footer-lang-link no-print" data-i18n="footer.langLink">欢迎页 · 语言</a>
      </div>
    </footer>

    <script src="app.js" defer></script>
  </body>
</html>
